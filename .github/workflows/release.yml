name: release

# Cut a release in two stages, so nothing is published before every asset is
# built, signed and staged (immutable releases: a published tag name burns):
#
#   build    (workflow_dispatch, stage=build, on the build commit C = head of
#            --ref): build the self-contained lw executable for each platform
#            (luvi + the full tree fused), the signed system-Lua bundle, the descriptor, signed
#            SHA256SUMS and provenance, and stage them all as an UNPUBLISHED
#            DRAFT release vX in this repository, targeting C (no tag yet).
#   publish  (push of the annotated tag vX on C; or workflow_dispatch
#            stage=publish to re-run the gate): never rebuilds. Checks that vX
#            is an annotated tag on exactly the draft's build commit, that
#            SHA256SUMS is signed by the committed release key and every asset
#            matches it, and that the bundle manifest and descriptor name vX
#            (scripts/release/verify_draft.sh); only then publishes the draft.
#            No draft, or any failed check: the job fails, nothing is published.
#
# The editor plugin pins published lw releases in its own repository; nothing
# here depends on it. See ARCHITECTURE.md "Standalone Runner & Distribution"
# and keys/README.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (no leading v), e.g. 1.2.3 or 1.2.3-beta.1'
        required: true
      stage:
        description: 'build: stage a draft release from this commit; publish: re-run the tag gate for an existing tag'
        type: choice
        options: [build, publish]
        default: build

permissions:
  contents: write

env:
  LUVI_VERSION: v2.15.0

jobs:
  # Release notes gate (spec §16.37): a full release needs its CHANGELOG.md
  # entry — checked first, so a missing entry fails in seconds with the fix
  # spelled out, before anything is built or published. A prerelease only warns.
  # Also renders the release page's description from the same text.
  notes:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        shell: bash
        # Untrusted input goes through env, never interpolated into the script.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version '$INPUT_VERSION' is not <n>.<n>.<n>[-pre]"; exit 1
          fi
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the release notes
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: python3 scripts/release/release_notes.py check "$VERSION" CHANGELOG.md

      - name: Render the release description
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p notes
          python3 scripts/release/release_notes.py body "$VERSION" notes/release-body.md CHANGELOG.md
          cat notes/release-body.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/release-body.md
          if-no-files-found: error

  # One self-contained executable per platform (spec §16.11): luvi with the
  # full tree fused in (scripts/release/stage_tree.sh), CHANGELOG.md included,
  # so it waits for the notes gate. `luvi --output` fuses the *running* luvi, so
  # each leg must run on its own OS/arch (no cross-fusing).
  hosts:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'build'
    needs: [notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: luvi-Linux-x86_64-luajit-regular
            luvi: luvi
            out: lw-linux-x86_64
          # arm64 Linux: add an entry with `os: ubuntu-24.04-arm` and
          # asset `luvi-Linux-aarch64-luajit-regular` once that runner is
          # available to you (luvi ships the binary).
          # Intel macOS: the `macos-13` label no longer schedules (v0.1.0 sat
          # queued for an hour with no runner assigned), and `publish` needs
          # every host leg, so one dead label blocks the entire release.
          # Re-add an Intel entry once a label is confirmed to schedule — luvi
          # ships the Darwin-x86_64 binary either way.
          - os: macos-latest
            asset: luvi-Darwin-arm64-luajit-regular
            luvi: luvi
            out: lw-macos-arm64
          - os: windows-latest
            asset: luvi-Windows-amd64-luajit-regular.exe
            luvi: luvi.exe
            out: lw-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch luvi
        shell: bash
        run: |
          curl -fsSL -o "${{ matrix.luvi }}" \
            "https://github.com/luvit/luvi/releases/download/${LUVI_VERSION}/${{ matrix.asset }}"
          chmod +x "${{ matrix.luvi }}" || true

      # The release version is baked into the host (boot/verify.lua
      # RELEASE_VERSION, spec §16.32) so `lw version` reports it and
      # `lw self-update` can tell whether the installed host is current.
      - name: Resolve version
        id: v
        shell: bash
        # Untrusted input goes through env, never interpolated into the script.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The committed source embeds the production key (spec §16.12) so source
      # builds verify real releases; fail if it ever drifts from the key file.
      - name: Check the embedded key is the committed production key
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          src = open("lua/boot/verify.lua").read()
          m = re.search(r'M\.PUBLIC_KEY_PEM = \[\[(.*?)\]\]', src, re.S)
          prod = open("keys/loomworks-release.pub.pem").read().replace("\r", "").strip()
          assert m and m.group(1).replace("\r", "").strip() == prod, \
              "lua/boot/verify.lua does not embed keys/loomworks-release.pub.pem"
          print("embedded key == keys/loomworks-release.pub.pem")
          PY

      - name: Fuse host binary
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash scripts/release/fuse_host.sh "./${{ matrix.luvi }}" keys/loomworks-release.pub.pem "${{ matrix.out }}" "$VERSION"

      # Prove the injection took and the executable is self-contained: it must
      # report the release it was built as (or self-update would replace it
      # forever), run `lw help`, and never load a bundle from the install
      # folder (a decoy one is planted). Records its size and cold-start time
      # in the job summary.
      - name: Smoke-test the executable
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash scripts/release/smoke_exe.sh "./${{ matrix.out }}" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # The platform-independent, signed system-Lua bundle + manifest (it carries
  # CHANGELOG.md, so it waits for the notes gate).
  bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'build'
    needs: [notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: v
        shell: bash
        # Untrusted input goes through env, never interpolated into the script.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write signing key
        shell: bash
        run: printf '%s\n' "${{ secrets.LOOMWORKS_SIGNING_KEY }}" > sign.key

      - name: Build bundle + signed manifest
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash scripts/release/build_bundle.sh "$VERSION" dist sign.key

      - name: Verify the signature with the committed public key
        shell: bash
        run: |
          # The hosts job bakes keys/loomworks-release.pub.pem into every
          # binary, so a signing secret that does not match it would produce a
          # release no host can verify — and we would only find out when a user
          # ran `lw self-update`. Fail here instead.
          openssl dgst -sha256 -verify keys/loomworks-release.pub.pem \
            -signature dist/manifest.json.sig dist/manifest.json

      - name: Drop signing key
        if: always()
        run: rm -f sign.key

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
          if-no-files-found: error

  # Gate: the bundle from this tag must still run under released hosts
  # (spec §16.14) — an old host that `lw self-update`s runs it with its own,
  # older boot modules. See scripts/ci/old-host-compat.sh.
  old-host-compat:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'build'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Run the bundle under released hosts
        shell: bash
        env:
          # every old lw release lives in loomworks.nvim, not this repo
          REPO_SLUG: samienne/loomworks.nvim
        run: bash scripts/ci/old-host-compat.sh

  # Build stage: stage every asset as a draft release (nothing published).
  draft:
    needs: [notes, hosts, bundle, old-host-compat]
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release
      id-token: write       # mint the Sigstore token for attestation
      attestations: write   # record build provenance
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo        # for the public key; keep it out of release/

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect assets
        shell: bash
        run: |
          mkdir -p release
          # The rendered description is not a release asset.
          mv incoming/release-notes/release-body.md release-body.md
          rm -rf incoming/release-notes
          find incoming -type f -exec cp {} release/ \;
          ls -la release

      # The binary descriptor (spec §16.41): what this release implements
      # (protocol range, interface versions + schema digests, working-copy
      # schemas), printed by this release's self-contained Linux executable —
      # the same `lw version --json` a user runs. Published as
      # lw-<version>-descriptor.json and covered by SHA256SUMS below.
      - name: Generate the binary descriptor
        shell: bash
        env:
          VER: ${{ github.event.inputs.version || github.ref_name }}
        run: bash repo/scripts/release/descriptor.sh "${VER#v}" release

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          # Per-asset hashes so the install commands can verify a host binary
          # before its first execution (spec §16.15). The bundle is additionally
          # signature-verified by the host; these cover the host binaries too.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        shell: bash
        run: |
          # Signing the hash list moves the install-time trust anchor from a
          # per-release hash to the long-lived release key, so the documented
          # commands never need editing when a release is cut (spec §16.15).
          printf '%s\n' "${{ secrets.LOOMWORKS_SIGNING_KEY }}" > sign.key
          openssl dgst -sha256 -sign sign.key \
            -out release/SHA256SUMS.sig release/SHA256SUMS
          rm -f sign.key
          # Same guard as the bundle job: prove the signature verifies under the
          # public key that ships in the host binaries, not just under whatever
          # key happens to be in the secret.
          openssl dgst -sha256 -verify repo/keys/loomworks-release.pub.pem \
            -signature release/SHA256SUMS.sig release/SHA256SUMS

      - name: Drop signing key
        if: always()
        run: rm -f sign.key

      # Provenance anchored in Sigstore's public transparency log — independent
      # of this repo, so `gh attestation verify` needs no key material and no
      # per-release hash. Preinstalled `gh` makes this the CI install path.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/lw-*'

      # A tag with a pre-release suffix (v0.2.0-beta.1) is published as a GitHub
      # pre-release, so `/releases/latest` — the `stable` update channel
      # (spec §16.29) — excludes it, while the `unstable` channel (releases API)
      # still finds it. A full release (no `-`) stays non-prerelease.
      - name: Determine prerelease
        id: rel
        shell: bash
        env:
          VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          ver="$VER"
          case "$ver" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Immutable releases: a published release is frozen, so assets cannot be
      # attached after it goes live. The build stage creates the release as a
      # DRAFT with every asset attached and no tag yet (it targets the build
      # commit, recorded as the draft's target_commitish); the publish stage
      # un-drafts it once the tag on that commit verifies.
      - name: Stage the draft release (assets, no tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ github.event.inputs.version }}
          PRERELEASE: ${{ steps.rel.outputs.prerelease }}
        run: |
          tag="v$VER"
          # A tag name burns once a release used it; never stage over an
          # existing release (draft or published, found by listing: a draft
          # has no tag to look up) or tag. A stale draft: delete it first
          # (gh api -X DELETE repos/<repo>/releases/<id>).
          n="$(bash repo/scripts/release/draft.sh count "$GITHUB_REPOSITORY" "$tag")"
          if [ "$n" != 0 ]; then
            echo "::error::$n release(s) named $tag already exist; delete a stale draft first, or bump the version"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists; the tag goes on the build commit, after this stage"; exit 1
          fi
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          gh release create "$tag" release/* -R "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "$tag" --notes-file release-body.md ${pre[@]+"${pre[@]}"}
          echo "staged draft $tag from $GITHUB_SHA; next: git tag -a $tag $GITHUB_SHA -m $tag, then git push origin $tag"

  # Tag push: check the tag, verify the draft built from its commit, then
  # publish that draft. Never builds anything.
  publish:
    if: github.event_name == 'push' || inputs.stage == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # publish the draft
    steps:
      - name: Resolve version
        id: v
        shell: bash
        # Untrusted input goes through env, never interpolated into the script.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          ver="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::version '$ver' is not <n>.<n>.<n>[-pre]"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      # The tagged commit must be the build commit (checked below), so these
      # are the scripts and the committed release key the draft was built with.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.v.outputs.tag }}

      - name: Find the draft
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        # Exactly one draft with tag_name $TAG (listed, not looked up by tag:
        # zero or several fail); its id drives the download and the publish.
        run: |
          info="$(bash scripts/release/draft.sh find "$GITHUB_REPOSITORY" "$TAG")" || {
            echo "::error::no unique draft release $TAG: dispatch release.yml with stage=build on the build commit first"; exit 1; }
          id="$(printf '%s' "$info" | cut -f1)"
          build="$(printf '%s' "$info" | cut -f2)"
          printf '%s' "$build" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::the draft $TAG records no build commit (target '$build')"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "draft $TAG (release $id) built from $build"

      # The tag as GitHub holds it (read through the API: a checkout can turn an
      # annotated tag into a lightweight one). It must be an annotated tag on
      # exactly the draft's build commit, so the published tag names the
      # source the assets were built from.
      - name: Check the tag is annotated and on the build commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          BUILD: ${{ steps.draft.outputs.build }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')" \
            || { echo "::error::no tag $TAG on $GITHUB_REPOSITORY"; exit 1; }
          type="$(printf '%s' "$ref" | cut -f1)"
          obj="$(printf '%s' "$ref" | cut -f2)"
          if [ "$type" != tag ]; then
            echo "::error::$TAG is not an annotated tag (git tag -a)"; exit 1
          fi
          commit="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq 'select(.object.type == "commit") | .object.sha')"
          if [ "$commit" != "$BUILD" ]; then
            echo "::error::$TAG points at '$commit', but the draft was built from $BUILD; tag the build commit"; exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$BUILD" ]; then
            echo "::error::the checkout of $TAG is $head, not the build commit $BUILD"; exit 1
          fi
          echo "$TAG is an annotated tag on the build commit $BUILD"

      - name: Download the draft's assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: |
          bash scripts/release/draft.sh download "$GITHUB_REPOSITORY" "$ID" draft SHA256SUMS SHA256SUMS.sig
          # Every asset SHA256SUMS lists; verify_draft.sh rejects odd names.
          mapfile -t names < <(sed -e 's/\r$//' -e 's/^[0-9a-f]*  *\*\{0,1\}//' draft/SHA256SUMS)
          bash scripts/release/draft.sh download "$GITHUB_REPOSITORY" "$ID" draft "${names[@]}"
          ls -la draft

      # The gate: SHA256SUMS signed by the committed release key, every asset
      # present and matching it, the required assets listed, and the bundle
      # manifest and descriptor naming this version.
      - name: Verify the draft
        shell: bash
        env:
          VER: ${{ steps.v.outputs.version }}
        run: bash scripts/release/verify_draft.sh "$VER" draft keys/loomworks-release.pub.pem

      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.draft.outputs.id }}
        run: bash scripts/release/draft.sh publish "$GITHUB_REPOSITORY" "$ID"
