<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#202124">
  <title>lw process model</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <g stroke="#5f6368" stroke-width="1.2">
    <rect x="30" y="50" width="210" height="46" rx="8" fill="#e8f0fe"/>
    <rect x="30" y="112" width="210" height="46" rx="8" fill="#e8f0fe"/>
    <rect x="30" y="200" width="210" height="46" rx="8" fill="#e8f0fe"/>
    <rect x="30" y="276" width="210" height="46" rx="8" fill="#e8f0fe" stroke-dasharray="5 3"/>
    <rect x="320" y="70" width="240" height="50" rx="8" fill="#fff4d6"/>
    <rect x="320" y="160" width="240" height="140" rx="8" fill="#e6f4ea"/>
    <rect x="300" y="350" width="280" height="64" rx="8" fill="#f1f3f4"/>
    <rect x="650" y="50" width="220" height="56" rx="8" fill="#fce8e6"/>
    <rect x="650" y="130" width="220" height="56" rx="8" fill="#fce8e6"/>
    <rect x="650" y="210" width="220" height="56" rx="8" fill="#fce8e6"/>
    <rect x="650" y="290" width="220" height="56" rx="8" fill="#f1f3f4"/>
  </g>
  <g stroke="#5f6368" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M240 73 L318 88"/>
    <path d="M240 135 L318 102"/>
    <path d="M240 299 C290 299 290 112 318 112"/>
    <path d="M440 120 V158"/>
    <path d="M440 300 V348"/>
    <path d="M560 190 L648 80"/>
    <path d="M560 215 L648 158"/>
    <path d="M560 245 L648 238"/>
    <path d="M560 275 L648 312"/>
    <path d="M135 246 V274"/>
  </g>
  <g stroke="#5f6368" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#a)">
    <path d="M100 322 C100 400 200 400 298 385"/>
  </g>
  <g text-anchor="middle">
    <text x="450" y="26" font-size="15" font-weight="bold">One daemon per workspace: clients, discovery and child processes</text>
    <text x="135" y="70" font-weight="bold">lw build (CLI)</text>
    <text x="135" y="87" font-size="11">client process</text>
    <text x="135" y="132" font-weight="bold">lw status (CLI)</text>
    <text x="135" y="149" font-size="11">client process</text>
    <text x="135" y="220" font-weight="bold">Editor plugin</text>
    <text x="135" y="237" font-size="11">stdin/stdout to the relay</text>
    <text x="135" y="296" font-weight="bold">lw daemon run --stdio</text>
    <text x="135" y="313" font-size="11">relay: a connection, not a daemon</text>
    <text x="440" y="91" font-weight="bold">Endpoint</text>
    <text x="440" y="108" font-size="11">Unix socket / Windows named pipe</text>
    <text x="440" y="184" font-weight="bold">Workspace daemon</text>
    <text x="440" y="204" font-size="12">lw daemon run --root &lt;workspace&gt;</text>
    <text x="440" y="226" font-size="12">holds the runtime lock R</text>
    <text x="440" y="244" font-size="12">keeps the workspace model loaded</text>
    <text x="440" y="262" font-size="12">runs tasks, streams their output</text>
    <text x="440" y="280" font-size="12">one per workspace and user slot</text>
    <text x="440" y="374" font-weight="bold">Daemon handle</text>
    <text x="440" y="392" font-size="11">&lt;ws&gt;/.nvim/loomworks.daemon-&lt;slot&gt;.json</text>
    <text x="440" y="406" font-size="11">pid, endpoint, versions, clients, busy</text>
    <text x="760" y="74" font-weight="bold">Build tools</text>
    <text x="760" y="92" font-size="11">cmake, meson, ninja, compilers</text>
    <text x="760" y="154" font-weight="bold">Tests and launched programs</text>
    <text x="760" y="172" font-size="11">output streamed as task frames</text>
    <text x="760" y="234" font-weight="bold">Devices</text>
    <text x="760" y="252" font-size="11">through an SDK's device runner</text>
    <text x="760" y="314" font-weight="bold">Workspace files</text>
    <text x="760" y="332" font-size="11">loomworks.json, .nvim/ (watched)</text>
    <text x="200" y="440" font-size="11">clients read the handle to find the endpoint, authenticate,</text>
    <text x="200" y="455" font-size="11">and start a daemon when none runs</text>
    <text x="440" y="334" font-size="11">writes</text>
  </g>
</svg>
